# PawHub — one-click, reproducible stack: MongoDB + Express API + Vue frontend.
# Usage:  docker compose up --build
#   Frontend -> http://localhost:5173
#   Backend  -> http://localhost:5001
# Data persists in the `mongo_data` volume; `docker compose down -v` resets it.

services:
  mongo:
    image: mongo:7
    container_name: pawhub-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    container_name: pawhub-backend
    restart: unless-stopped
    environment:
      PORT: 5001
      MONGO_URI: mongodb://mongo:27017/pawhub
      JWT_SECRET: change_me_in_production
    ports:
      - '5001:5001'
    volumes:
      # Serve the seeded pet/post images. Mounted where `../pictures` resolves
      # from the app working dir (/app -> /pictures).
      - ./pictures:/pictures:ro
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5001
        VITE_WS_URL: http://localhost:5001
    container_name: pawhub-frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  mongo_data:
